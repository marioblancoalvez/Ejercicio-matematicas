	<body>
		<pre>"Si, repite la hormiga,
he visto las estrellas.
subi al arbol mas alto
que tiene la alameda
y vi miles de ojos
dentro de mis tinieblas."</pre>
	
		<p>Extracto del poema <cite><b>Los encuentros de un caracol aventurero</cite></b>, de Federico Grcia Lorca.</p>
